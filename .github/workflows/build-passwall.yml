name: Build PassWall to Repo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout opkg-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 zstd file

      - name: Download & Prepare OpenWrt SDK
        run: |
          # 自动获取 OpenWrt 官方最新稳定版 x86_64 SDK 链接，避免固定链接 404
          SDK_URL=$(wget -qO- https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -o 'openwrt-sdk-[^"]*x86-64[^"]*\.tar\.zst' | head -n 1)
          if [ -n "$SDK_URL" ]; then
            DOWNLOAD_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_URL}"
          else
            DOWNLOAD_URL="https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.zst"
          fi
          echo "Downloading SDK from: $DOWNLOAD_URL"
          wget -q --show-progress "$DOWNLOAD_URL" -O sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
          rm -f sdk.tar.zst

      - name: Clone PassWall Sources
        run: |
          cd sdk/package
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall-packages.git pw-dep
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall.git luci-app-passwall

      - name: Compile PassWall Packages
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-passwall/compile -j$(nproc) || make package/luci-app-passwall/compile V=s

      - name: Update Repo Packages
        run: |
          mkdir -p luci packages base
          find sdk/bin/packages/x86_64/ -name "*.ipk" -exec cp {} packages/ \; 2>/dev/null || true
          find sdk/bin/packages/x86_64/ -name "luci-app-passwall*.ipk" -exec cp {} luci/ \; 2>/dev/null || true

          # 重新生成索引 Packages.gz
          cd sdk
          if [ -f "./scripts/ipkg-make-index.sh" ]; then
            ./scripts/ipkg-make-index.sh ../packages > ../packages/Packages
            gzip -9nc ../packages/Packages > ../packages/Packages.gz
            ./scripts/ipkg-make-index.sh ../luci > ../luci/Packages
            gzip -9nc ../luci/Packages > ../luci/Packages.gz
          fi
          cd ..
          rm -rf sdk

      - name: Commit and Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git diff --staged --quiet || git commit -m "Auto build & update PassWall [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push origin main
